# APILedger 不打包发布 (源码平铺在 src/, 运行时把 src/ 加入 sys.path 即可),
# 因此这里不放构建后端, 只保留项目元数据与 pytest 配置。
#
# 依赖与任务统一由 pixi.toml 管理, 不要在此重复声明 dependencies,
# 否则两处会各说各话 (pixi 只认 pixi.toml, pip 只认这里)。

[project]
name = "APILedger"
version = "0.1.0"
description = "API 调用台账管理工具"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
